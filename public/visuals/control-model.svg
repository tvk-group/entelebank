<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">EnteleBANK control model</title><desc id="d">A layered diagram showing board and governance, independent risk and compliance, secure operations, technology and third parties, and customer outcomes.</desc><rect width="1200" height="560" rx="28" fill="#fbfbfa"/><text x="70" y="75" fill="#102747" font-family="Georgia,serif" font-size="40">Control by design</text><text x="70" y="108" fill="#5d6571" font-family="Arial" font-size="16">Prospective operating model · illustrative · subject to authorisation design</text><g font-family="Arial" font-size="18"><rect x="130" y="155" width="940" height="62" rx="10" fill="#102747"/><text x="600" y="194" fill="white" text-anchor="middle">BOARD · STRATEGY · RISK APPETITE · CULTURE</text><rect x="185" y="240" width="830" height="62" rx="10" fill="#761633"/><text x="600" y="279" fill="white" text-anchor="middle">INDEPENDENT RISK · COMPLIANCE · FINANCIAL CRIME</text><rect x="240" y="325" width="720" height="62" rx="10" fill="#e9e2d5"/><text x="600" y="364" fill="#102747" text-anchor="middle">SECURE OPERATIONS · RESILIENCE · CUSTOMER SERVICE</text><rect x="295" y="410" width="610" height="62" rx="10" fill="#f3f0ea" stroke="#c7a56a"/><text x="600" y="449" fill="#102747" text-anchor="middle">TECHNOLOGY · DATA · OUTSOURCING · ASSURANCE</text></g><path d="M600 217v23M600 302v23M600 387v23" stroke="#c7a56a" stroke-width="3"/><text x="600" y="515" fill="#761633" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18">CUSTOMER OUTCOMES AND SAFE, SOUND OPERATION</text></svg>