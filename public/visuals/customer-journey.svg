<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">EnteleBANK prospective customer journey</title><desc id="desc">Illustrative pre-authorisation journey from understanding through application, controls, service, support and fair exit.</desc><rect width="1200" height="430" rx="28" fill="#fbfbfa"/><text x="70" y="70" font-family="Georgia,serif" font-size="34" fill="#102747">Customer outcomes by design</text><text x="70" y="103" font-family="Arial,sans-serif" font-size="14" fill="#5d6571">Illustrative target journey · not a currently available banking service</text><path d="M120 225 H1080" stroke="#c7a56a" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle"><g><circle cx="140" cy="225" r="42" fill="#fff" stroke="#761633" stroke-width="2"/><text x="140" y="220" font-size="14" fill="#102747">Understand</text><text x="140" y="242" font-size="11" fill="#5d6571">clear terms</text></g><g><circle cx="365" cy="225" r="42" fill="#fff" stroke="#a88950" stroke-width="2"/><text x="365" y="220" font-size="14" fill="#102747">Apply</text><text x="365" y="242" font-size="11" fill="#5d6571">accessible</text></g><g><circle cx="590" cy="225" r="42" fill="#fff" stroke="#102747" stroke-width="2"/><text x="590" y="216" font-size="13" fill="#102747">Identity</text><text x="590" y="236" font-size="11" fill="#5d6571">KYC · controls</text></g><g><circle cx="815" cy="225" r="42" fill="#fff" stroke="#761633" stroke-width="2"/><text x="815" y="220" font-size="14" fill="#102747">Use</text><text x="815" y="242" font-size="11" fill="#5d6571">secure service</text></g><g><circle cx="1040" cy="225" r="42" fill="#fff" stroke="#a88950" stroke-width="2"/><text x="1040" y="216" font-size="13" fill="#102747">Support</text><text x="1040" y="236" font-size="11" fill="#5d6571">remedy · exit</text></g></g><rect x="250" y="330" width="700" height="48" rx="24" fill="#102747"/><text x="600" y="360" t