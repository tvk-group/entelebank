<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">EnteleBANK responsible data and AI governance</title><desc id="desc">Illustrative target governance cycle from approved purpose and governed data through controlled AI, human accountability, monitoring and evidence.</desc><rect width="1200" height="650" rx="28" fill="#fbfbfa"/><text x="70" y="70" fill="#102747" font-family="Georgia,serif" font-size="34">Responsible intelligence by design</text><text x="70" y="104" fill="#5d6571" font-family="Arial,sans-serif" font-size="15">Illustrative target model · AI supports controlled decisions; accountable people remain responsible</text><g font-family="Arial,sans-serif" font-size="17"><rect x="80" y="165" width="210" height="105" rx="18" fill="#102747"/><text x="185" y="207" text-anchor="middle" fill="white">Approved purpose</text><text x="185" y="235" text-anchor="middle" fill="#d9dee6" font-size="13">risk classification · owner</text><rect x="350" y="165" width="210" height="105" rx="18" fill="#f0e8dc" stroke="#c7a56a"/><text x="455" y="207" text-anchor="middle" fill="#102747">Governed data</text><text x="455" y="235" text-anchor="middle" fill="#5d6571" font-size="13">quality · privacy · access</text><rect x="620" y="165" width="210" height="105" rx="18" fill="#f7f4ef" stroke="#761633"/><text x="725" y="207" text-anchor="middle" fill="#761633">Controlled AI</text><text x="725" y="235" text-anchor="middle" fill="#5d6571" font-size="13">validation · least privilege</text><rect x="890" y="165" width="230" height="105" rx="18" fill="#102747"/><text x="1005" y="207" text-anchor="middle" fill="white">Human accountability</text><text x="1005" y="235" text-anchor="middle" fill="#d9dee6" font-size="13">challenge · approval · override</text><path d="M290 217h60M560 217h60M830 217h60" stroke="#c7a56a" stroke-width="3"/><rect x="210" y="360" width="350" height="110" rx="18" fill="#eef1f4" stroke="#102747"/><text x="385" y="405" text-anchor="middle" fill="#102747">Monitoring & customer outcomes</text><text x="385" y="435" text-anchor="middle" fill="#5d6571" font-size="13">performance · fairness · incidents · drift</text><rect x="640" y="360" width="350" height="110" rx="18" fill="#eef1f4" stroke="#102747"/><text x="815" y="405" text-anchor="middle" fill="#102747">Evidence & independent challenge</text><text x="815" y="435" text-anchor="middle" fill="#5d6571" font-size="13">audit trail · validation · assurance</text><path d="M1005 270v45c0 25-20 45-45 45M640 415h-80M385 360v-45c0-25 20-45 45-45" fill="none" stroke="#761633" stroke-width="2"/><text x="600" y="565" text-anchor="middle" fill="#761633" font-weight="bold">No uncontrolled autonomous authority over regulated decisions or customer funds</text><text x="600" y="602" text-anchor="middle" fill="#5d6571" font-size="14">Target governance architecture — not a representation of a live authorised banking system</text></g></svg>