<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">EnteleBANK development journey</title><desc id="d">A six-stage development journey from corporate foundation to possible mobilisation and launch, subject to regulatory assessment.</desc><rect width="1200" height="360" rx="28" fill="#f8f7f3"/><path d="M90 180H1110" stroke="#d8d2c6" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#a88950" stroke-width="2"><circle cx="110" cy="180" r="34"/><circle cx="306" cy="180" r="34"/><circle cx="502" cy="180" r="34"/><circle cx="698" cy="180" r="34"/><circle cx="894" cy="180" r="34"/><circle cx="1090" cy="180" r="34"/></g><g fill="#761633" font-size="18" font-weight="700"><text x="110" y="187">1</text><text x="306" y="187">2</text><text x="502" y="187">3</text><text x="698" y="187">4</text><text x="894" y="187">5</text><text x="1090" y="187">6</text></g><g fill="#102747" font-size="15" font-weight="700"><text x="110" y="245">Foundation</text><text x="306" y="245">RBP</text><text x="502" y="245">Pre-application</text><text x="698" y="245">Readiness</text><text x="894" y="245">Assessment</text><text x="1090" y="245">Possible mobilisation</text></g><g fill="#5d6571" font-size="12"><text x="110" y="270">Corporate &amp; governance</text><text x="306" y="270">Business plan &amp; evidence</text><text x="502" y="270">PRA/FCA engagement</text><text x="698" y="270">Controls &amp; resources</text><text x="894" y="270">Regulatory decision</text><text x="1090" y="270">If authorised/restricted</text></g></g><text x="60" y="70" font-family="Georgia,serif" font-size="30" fill="#102747">Readiness before authorisation</text><text x="60" y="100" font-family="Arial,sans-serif" font-size="14" fill="#5d6571">Development roadmap only — not evidence of PRA/FCA approval and not an authorisation timeline.</text></svg>
