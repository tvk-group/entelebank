name: Quality & Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Verify dependency policy
        run: |
          test -f package-lock.json
          node -e "const p=require('./package.json'); for (const [n,v] of Object.entries(p.dependencies||{})) { if (/^[~^*]|latest|x/i.test(v)) { console.error('Dependency must be exactly pinned:', n, v); process.exitCode=1; } }"
          node -e "const p=require('./package.json'); if (p.packageManager !== 'npm@10.9.8') { console.error('packageManager must be npm@10.9.8'); process.exit(1); }"
      - name: Deterministic install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile remained unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Verify zero-omission locale completeness
        run: node scripts/check-i18n.mjs
      - run: npm run build
      - name: High/critical production dependency audit
        run: npm audit --omit=dev --audit-level=high
